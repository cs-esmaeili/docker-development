; Global PHP CLI defaults (mounted into every `php` invocation).
memory_limit = 512M
max_execution_time = 0

upload_max_filesize = 100M
post_max_size = 100M
sys_temp_dir = /tmp
upload_tmp_dir = /tmp

; Dev-friendly: no CLI opcache surprises
opcache.enable = 0
opcache.enable_cli = 0

date.timezone = UTC
error_reporting = E_ALL
display_errors = On
